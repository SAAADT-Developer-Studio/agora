[project]
name = "clusterer"
version = "0.1.0"
requires-python = "~=3.13.0"
dependencies = [
    "apscheduler>=3.11.3",
    "database",
]

[tool.uv.sources]
database = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["clusterer"]

[tool.setuptools.package-dir]
clusterer = "."
