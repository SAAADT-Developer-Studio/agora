[ssh_connection]
# Ansible's own defaults, kept on purpose: ControlMaster/ControlPersist
# multiplex the deploy's SSH sessions. ServerAlive* is added on top.
# GitHub-hosted runners egress through an Azure load balancer that drops
# idle TCP after 4 minutes. CREATE INDEX CONCURRENTLY prints nothing, so
# without keepalives that session is reset and the play dies UNREACHABLE.
# 30s * 120 failures is an hour, past the deploy job's own timeout.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o ServerAliveCountMax=120
