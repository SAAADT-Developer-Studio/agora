---
- name: Deploy stack to Hetzner VM
  hosts: hetzner_vms
  become: true

  vars:
    docker_image_tag: "{{ lookup('env', 'DOCKER_IMAGE_TAG') }}"
    docker_hub_username: "{{ lookup('env', 'DOCKER_HUB_USERNAME') }}"
    docker_hub_token: "{{ lookup('env', 'DOCKER_HUB_TOKEN') }}"
    project_dir: /opt/agora
    app_secrets:
      # Docker image configuration
      DOCKER_HUB_USERNAME: "{{ docker_hub_username }}"
      DOCKER_IMAGE_TAG: "{{ docker_image_tag }}"
      # App configuration
      APP_ENV: production
      OPENROUTER_API_KEY: "{{ lookup('env', 'OPENROUTER_API_KEY') }}"
      OPENROUTER_FALLBACK_API_KEY: "{{ lookup('env', 'OPENROUTER_FALLBACK_API_KEY') }}"
      OPENAI_API_KEY: "{{ lookup('env', 'OPENAI_API_KEY') }}"
      DATABASE_URL: "{{ lookup('env', 'DATABASE_URL') }}"
      PEXELS_API_KEY: "{{ lookup('env', 'PEXELS_API_KEY') }}"
      # Grafana Alloy configuration
      GRAFANA_LOKI_URL: "{{ lookup('env', 'GRAFANA_LOKI_URL') }}"
      GRAFANA_LOKI_USERNAME: "{{ lookup('env', 'GRAFANA_LOKI_USERNAME') }}"
      GRAFANA_PROMETHEUS_URL: "{{ lookup('env', 'GRAFANA_PROMETHEUS_URL') }}"
      GRAFANA_PROMETHEUS_USERNAME: "{{ lookup('env', 'GRAFANA_PROMETHEUS_USERNAME') }}"
      GRAFANA_CLOUD_API_KEY: "{{ lookup('env', 'GRAFANA_CLOUD_API_KEY') }}"

  tasks:
    - name: Ensure Docker login
      community.docker.docker_login:
        username: "{{ docker_hub_username }}"
        password: "{{ docker_hub_token }}"
      no_log: true

    - name: Create project directory
      ansible.builtin.file:
        path: "{{ project_dir }}"
        state: directory
        mode: "0755"

    - name: Check for legacy deploy directory
      ansible.builtin.stat:
        path: /opt/scraper/docker-compose.yml
      register: legacy_compose

    - name: Stop legacy stack at /opt/scraper
      ansible.builtin.command:
        cmd: docker compose down
        chdir: /opt/scraper
      when: legacy_compose.stat.exists

    - name: Copy docker-compose.yml to server
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../docker-compose.yml"
        dest: "{{ project_dir }}/docker-compose.yml"
        mode: "0644"

    - name: Copy config.alloy to server
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../config.alloy"
        dest: "{{ project_dir }}/config.alloy"
        mode: "0644"

    - name: Create .env file with secrets
      ansible.builtin.copy:
        content: |
          {% for key, value in app_secrets.items() %}
          {{ key }}={{ value }}
          {% endfor %}
        dest: "{{ project_dir }}/.env"
        mode: "0600"
      no_log: true

    - name: Pull latest images
      ansible.builtin.command:
        cmd: docker compose pull
        chdir: "{{ project_dir }}"
      register: pull_result
      changed_when: "'Downloaded' in pull_result.stdout or 'Pull complete' in pull_result.stdout"

    # The clusterer schedule is APScheduler inside the container, not a host
    # timer or cron. Stopping the compose service stops that loop. Already
    # stopped or never created containers are a no-op. docker compose up -d
    # below starts them again on the new images.
    - name: Stop scraper and clusterer before migrations
      ansible.builtin.command:
        cmd: docker compose stop --timeout 30 scraper clusterer
        chdir: "{{ project_dir }}"
      register: app_stop
      changed_when: "'Stopping' in app_stop.stdout or 'Stopping' in app_stop.stderr"

    - name: Apply database migrations
      ansible.builtin.command:
        cmd: docker compose run --rm --no-deps scraper alembic -c /app/packages/database/alembic.ini upgrade head
        chdir: "{{ project_dir }}"
      register: migration_result
      changed_when: "'Running upgrade' in migration_result.stderr"

    - name: Start docker-compose stack
      ansible.builtin.command:
        cmd: docker compose up -d --remove-orphans
        chdir: "{{ project_dir }}"
      register: compose_result
      changed_when: "'Started' in compose_result.stderr or 'Creating' in compose_result.stderr"

    - name: Wait for containers to be healthy
      ansible.builtin.pause:
        seconds: 5

    - name: Verify scraper container is running
      community.docker.docker_container_info:
        name: scraper
      register: scraper_info

    - name: Verify clusterer container is running
      community.docker.docker_container_info:
        name: clusterer
      register: clusterer_info

    - name: Verify alloy container is running
      community.docker.docker_container_info:
        name: alloy
      register: alloy_info

    - name: Fail if scraper container is not running
      ansible.builtin.fail:
        msg: "Scraper container is not running or has crashed."
      when: scraper_info.container.State.Status != "running"

    - name: Fail if clusterer container is not running
      ansible.builtin.fail:
        msg: "Clusterer container is not running or has crashed."
      when: clusterer_info.container.State.Status != "running"

    - name: Fail if alloy container is not running
      ansible.builtin.fail:
        msg: "Alloy container is not running or has crashed."
      when: alloy_info.container.State.Status != "running"

    - name: Install ranking service
      ansible.builtin.copy:
        dest: /etc/systemd/system/agora-ranking.service
        mode: "0644"
        content: |
          [Unit]
          Description=Score the latest production clustering run and expire older ranking data
          Requires=docker.service
          After=docker.service network-online.target

          [Service]
          Type=oneshot
          WorkingDirectory={{ project_dir }}
          ExecStart=/usr/bin/docker compose run --rm --no-deps -T --name agora-ranking scraper timeout --signal=TERM --kill-after=30s 25m python3 -u -m scripts.rank_clusters --days 30
          ExecStopPost=-/usr/bin/docker rm -f agora-ranking
          TimeoutStartSec=27min
          TimeoutStopSec=45s
          StandardOutput=journal
          StandardError=journal

    - name: Install ranking timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/agora-ranking.timer
        mode: "0644"
        content: |
          [Unit]
          Description=Rank clusters every 30 minutes

          [Timer]
          OnCalendar=*-*-* *:00,30:00 UTC
          AccuracySec=1s
          Persistent=true

          [Install]
          WantedBy=timers.target

    - name: Enable ranking every 30 minutes
      ansible.builtin.systemd_service:
        name: agora-ranking.timer
        enabled: true
        state: started
        daemon_reload: true

    - name: Remove dangling images to save space
      community.docker.docker_prune:
        containers: false
        images: true
        images_filters:
          dangling: false
        networks: false
        volumes: false
