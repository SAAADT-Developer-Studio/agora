name: Test Scraper

on:
  pull_request:
    paths:
      - "scraper/**"
      - "packages/database/**"
      - "pyproject.toml"
      - "uv.lock"
      - "!scraper/**/*.md"
      - ".github/workflows/test-scraper.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv sync --package scraper --group test

      # TODO: Add database setup when integration tests are added
      # TODO: Add linting/formatting checks (black, mypy, ruff)

      - name: Run tests
        run: |
          uv run --package scraper --directory scraper pytest
        env:
          APP_ENV: test
          OPENROUTER_API_KEY: test_key_not_used_in_unit_tests
          OPENAI_API_KEY: test_key_not_used_in_unit_tests
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          PEXELS_API_KEY: test_key_not_used_in_unit_tests

      # TODO: Add coverage reporting when needed
      # TODO: Add test result artifacts when test suite grows
