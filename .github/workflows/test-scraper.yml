name: Test Scraper

on:
  pull_request:
    paths:
      - "scraper/**"
      - "packages/database/**"
      - "pyproject.toml"
      - "uv.lock"
      - "!scraper/**/*.md"
      - ".github/workflows/test-scraper.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17 # matches the DigitalOcean cluster in infra/main.tf
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv sync --package scraper --group test

      # TODO: Add linting/formatting checks (black, mypy, ruff)

      - name: Run tests
        run: |
          uv run --package scraper --directory scraper pytest
        env:
          APP_ENV: test
          OPENROUTER_API_KEY: test_key_not_used_in_unit_tests
          OPENAI_API_KEY: test_key_not_used_in_unit_tests
          DATABASE_URL: postgresql://postgres:test@localhost:5432/test
          RANKING_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/test
          PEXELS_API_KEY: test_key_not_used_in_unit_tests

      # TODO: Add coverage reporting when needed
      # TODO: Add test result artifacts when test suite grows
