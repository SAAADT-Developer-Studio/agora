name: Test Clusterer

on:
  pull_request:
    paths:
      - "clusterer/**"
      - "packages/database/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/test-clusterer.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv sync --package clusterer --group test

      - name: Run tests
        run: |
          uv run --package clusterer --directory clusterer pytest
