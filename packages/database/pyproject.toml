[project]
name = "database"
version = "0.1.0"
requires-python = "~=3.13.0"
dependencies = [
    "sqlalchemy>=2.0.41,<3",
    "psycopg2-binary>=2.9.10,<3",
    "alembic>=1.14.0,<2",
    "python-dotenv>=1.0.1,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["database"]

[tool.setuptools.package-dir]
database = "."
